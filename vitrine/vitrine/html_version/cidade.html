<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lojas em Ibirama - VitrineLocal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cidade.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- barra-nav -->
    <nav class="barra-cidade">
        <div class="barra-cidade__inner">
            <a href="index.html" class="barra-cidade__logo">
                <span>Vitrine</span>Local
            </a>
            <button class="barra-cidade__cidade">
                <i data-lucide="map-pin" class="icone-xs"></i>
                <span id="barraCidadeNome">Cidade</span>
                <i data-lucide="chevron-down" class="icone-xs"></i>
            </button>
        </div>
    </nav>

    <!-- Hero -->
    <div class="cidade-hero">
        <div class="cidade-hero__inner">
            <a href="index.html" class="cidade-hero__voltar">
                <i data-lucide="arrow-left" class="icone-xs"></i>
                Trocar cidade
            </a>

            <h1 class="cidade-hero__titulo" id="cidadeNome">Carregando...</h1>
            <p class="cidade-hero__subtitulo">Explore as lojas locais</p>

            <div class="cidade-hero__status">
                <div>
                    <div class="cidade-hero__stat-valor" id="statLojas">0</div>
                    <div class="cidade-hero__stat-label">Lojas</div>
                </div>
                <div>
                    <div class="cidade-hero__stat-valor" id="statProdutos">0</div>
                    <div class="cidade-hero__stat-label">Produtos</div>
                </div>
                <div>
                    <div class="cidade-hero__stat-valor" id="statCategorias">0</div>
                    <div class="cidade-hero__stat-label">Categorias</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Conteúdo principal -->
    <div class="cidade-conteudo">

        <!-- Sidebar -->
        <aside class="cidade-sidebar">
            <div class="cidade-sidebar__busca">
                <i data-lucide="search" class="icone-xs"></i>
                <input type="text" id="buscaLoja" class="cidade-sidebar__input" placeholder="Buscar lojas...">
            </div>

            <h3 class="cidade-sidebar__titulo">Categorias</h3>
            <ul class="categoria-lista" id="categoriaLista">
                <!-- Preenchida por cidade.js -->
            </ul>
        </aside>

        <!-- Grade de lojas (preenchida por cidade.js) -->
        <main>
            <div class="lojas-grade" id="lojasGrade"></div>
        </main>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/cidade.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
