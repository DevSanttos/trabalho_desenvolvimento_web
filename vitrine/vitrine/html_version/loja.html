<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa & Design - VitrineLocal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/loja.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- barra de navegação -->
    <nav class="barra-loja">
        <div class="barra-loja__inner">
            <a href="index.html" class="barra-loja__logo">
                <span>Vitrine</span>Local
            </a>
            <button class="barra-loja__cidade">
                <i data-lucide="map-pin" class="icone-xs"></i>
                Ibirama, SC
                <i data-lucide="chevron-down" class="icone-xs"></i>
            </button>
        </div>
    </nav>

    <!-- Cabeçalho da loja-->
    <div class="loja-cabecalho">    
        <div class="loja-cabecalho__inner">
            <!-- Começa com uma imagem transparente (quadrado cinza). O JS coloca o logo real se houver. -->
            <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Logo da loja" class="loja-cabecalho__logo" id="lojaLogo">

            <div class="loja-cabecalho__corpo">
                <div class="loja-cabecalho__titulo-linha">
                    <h1 class="loja-cabecalho__titulo" id="lojaNome">Carregando...</h1>
                    <span class="etiqueta etiqueta-aberto">Aberto</span>
                </div>
                <p class="loja-cabecalho__categoria" id="lojaCategoria">Móveis</p>

                <div class="loja-cabecalho__infos">
                    <div class="loja-cabecalho__info-item">
                        <i data-lucide="map-pin" class="icone-xs"></i>
                        <span id="lojaEndereco">—</span>
                    </div>
                    <div class="loja-cabecalho__info-item">
                        <i data-lucide="clock" class="icone-xs"></i>
                        <span id="lojaHorario">—</span>
                    </div>
                </div>
            </div>

            <div class="loja-cabecalho__acoes">
                <button class="botao-whatsapp" id="btnWhatsapp">
                    <i data-lucide="message-circle" class="icone-sm"></i>
                    WhatsApp
                </button>
                <button class="botao-compartilhar">
                    <i data-lucide="share-2" class="icone-sm"></i>
                    Compartilhar
                </button>
            </div>
        </div>
    </div>

    <!-- Abas de categorias -->
    <nav class="loja-abas" aria-label="Categorias da loja">
        <!-- As abas são montadas por loja-publica.js a partir das categorias dos produtos -->
        <div class="loja-abas__lista" id="lojaAbas"></div>
    </nav>

    <!-- Grade de produtos (preenchida por loja-publica.js) -->
    <div class="produtos-grade" id="produtosGrade"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/loja-publica.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
