<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - VitrineLocal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cadastro.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="js/theme.js"></script>
</head>
<body>
    <button type="button" class="botao-tema botao-tema--flutuante" data-alternar-tema aria-label="Alternar tema claro/escuro" title="Alternar tema">
        <i data-lucide="sun" class="icone-sm icone-tema-sol"></i>
        <i data-lucide="moon" class="icone-sm icone-tema-lua"></i>
    </button>
    <div class="pagina-autenticacao">

        <!-- Painel esquerdo - Escuro -->
        <div class="painel-esquerdo">
            <div class="marca-grande"><span>Vitrine</span>Local</div>
        </div>

        <!-- Painel direito - Formulário -->
        <div class="painel-direito">
            <div class="painel-conteudo">
                <h2>Cadastrar loja</h2>
                <p class="subtitulo-formulario">
                    Preencha os dados para criar sua conta
                </p>

                <form class="campos-formulario" id="cadastroForm">
                    <div>
                        <label for="nomeLoja">Nome da loja *</label>
                        <input type="text" id="nomeLoja" class="input" placeholder="Ex: Casa &amp; Design" required>
                    </div>

                    <div>
                        <label for="cadastroEmail">E-mail *</label>
                        <input type="email" id="cadastroEmail" class="input" placeholder="seu@email.com" required>
                    </div>

                    <div>
                        <label for="cadastroSenha">Senha *</label>
                        <input type="password" id="cadastroSenha" class="input" placeholder="••••••••" required>
                    </div>

                    <div>
                        <label for="confirmaSenha">Confirmar senha *</label>
                        <input type="password" id="confirmaSenha" class="input" placeholder="••••••••" required>
                    </div>

                    <div class="termos-linha">
                        <input type="checkbox" id="termos" required>
                        <span class="cadastro__termos-texto">
                            Concordo com os
                            <a href="#">termos de uso</a>
                            e
                            <a href="#">política de privacidade</a>
                        </span>
                    </div>

                    <p id="cadastroMensagem" class="mensagem-erro"></p>

                    <div class="bloco-envio">
                        <button type="submit" class="botao">Criar conta</button>
                    </div>

                </form>

                <p class="rodape-formulario">
                    Já tem uma conta? <a href="login.html">Entrar</a>
                </p>
            </div>
        </div>

    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
    <script src="js/auth.js"></script>
</body>
</html>
