<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - VitrineLocal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cadastro.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="pagina-auth">

        <!-- Painel esquerdo - Escuro -->
        <div class="painel-esquerdo"></div>

        <!-- Painel direito - Formulário -->
        <div class="painel-direito">
            <div class="painel-conteudo">
                <h2>Cadastrar loja</h2>
                <p class="subtitulo-form">
                    Preencha os dados para criar sua conta
                </p>

                <form class="campos-formulario">
                    <div>
                        <label>Nome da loja *</label>
                        <input type="text" class="input" placeholder="Ex: Casa &amp; Design" required>
                    </div>

                    <div>
                        <label>E-mail *</label>
                        <input type="email" class="input" placeholder="seu@email.com" required>
                    </div>

                    <div>
                        <label>Senha *</label>
                        <input type="password" class="input" placeholder="••••••••" required>
                    </div>

                    <div>
                        <label>Confirmar senha *</label>
                        <input type="password" class="input" placeholder="••••••••" required>
                    </div>

                    <div class="termos-linha">
                        <input type="checkbox" required>
                        <span class="cadastro__termos-texto">
                            Concordo com os
                            <a href="#">termos de uso</a>
                            e
                            <a href="#">política de privacidade</a>
                        </span>
                    </div>

                    <div class="bloco-submit">
                        <a href="dashboard/index.html" class="botao">Criar conta</a>
                    </div>

                </form>

                <p class="rodape-formulario">
                    Já tem uma conta? <a href="login.html">Entrar</a>
                </p>
            </div>
        </div>

    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
