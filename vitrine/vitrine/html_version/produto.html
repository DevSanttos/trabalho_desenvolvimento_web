<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sofá Retrátil - VitrineLocal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/produto.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- barra de navegação -->
    <nav class="barra-produto">
        <div class="barra-produto__conteudo">
            <a href="index.html" class="barra-produto__logo">
                <span>Vitrine</span>Local
            </a>
            <button class="barra-produto__cidade">
                <i data-lucide="map-pin" class="icone-xs"></i>
                Ibirama, SC
                <i data-lucide="chevron-down" class="icone-xs"></i>
            </button>
        </div>
    </nav>

    <!-- Conteúdo principal -->
    <main class="produto-pagina">

        <!-- informações -->
        <div class="produto-layout">

            <!-- Coluna esquerda: galeria de imagens -->
            <section class="galeria" aria-label="Galeria de imagens do produto">
                <div class="galeria__imagem-bloco">
                    <!-- Começa transparente (fundo cinza). O JS coloca a foto real do produto se houver. -->
                    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Produto" class="galeria__imagem-principal" id="prodImagem">
                    <button class="galeria__seta galeria__seta--anterior" aria-label="Imagem anterior">
                        <i data-lucide="chevron-left" class="icone-sm"></i>
                    </button>
                    <button class="galeria__seta galeria__seta--proxima" aria-label="Próxima imagem">
                        <i data-lucide="chevron-right" class="icone-sm"></i>
                    </button>
                </div>

                <div class="galeria__miniaturas">
                    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Miniatura do produto" class="galeria__miniatura galeria__miniatura--ativa" id="prodMiniatura">
                </div>
            </section>

            <!-- Coluna direita: informações do produto -->
            <div class="produto-info">

                <!-- Cabeçalho: voltar + fechar -->
                <div class="produto-info__cabecalho">
                    <a href="loja.html" class="produto-info__voltar" id="prodVoltar">
                        <i data-lucide="arrow-left" class="icone-xs"></i>
                        Voltar para a loja
                    </a>
                    <a href="loja.html" class="botao-fechar" aria-label="Fechar" id="prodFechar">
                        <i data-lucide="x" class="icone-xs"></i>
                    </a>
                </div>

                <p class="produto-info__caminho" id="prodCaminho"></p>

                <!-- Categoria, título e preço -->
                <span class="produto-info__categoria" id="prodCategoria"></span>
                <h1 class="produto-info__titulo" id="prodTitulo">Carregando...</h1>
                <p class="produto-info__preco" id="prodPreco"></p>

                <!-- Descrição -->
                <p class="produto-info__descricao" id="prodDescricao"></p>

                <!-- Especificações -->
                <dl class="especificacoes">
                    <div>
                        <dt class="especificacao__rotulo">Marca</dt>
                        <dd class="especificacao__valor" id="prodMarca">—</dd>
                    </div>
                    <div>
                        <dt class="especificacao__rotulo">Categoria</dt>
                        <dd class="especificacao__valor" id="prodCategoriaEspec">—</dd>
                    </div>
                </dl>

                <!-- Ações principais -->
                <div class="produto-acoes">
                    <button class="botao-contato-whatsapp" id="btnWhatsappProduto">
                        <i data-lucide="message-circle" class="icone-sm"></i>
                        Falar com a loja no WhatsApp
                    </button>
                    <button class="botao-favoritar" aria-label="Favoritar produto">
                        <i data-lucide="heart" class="icone-sm"></i>
                    </button>
                </div>

            </div>
        </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/produto.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
