<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - Dashboard - VitrineLocal</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard-produtos.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">

        <!-- Sidebar -->
        <aside class="painel-lateral">
            <div class="logo-lateral">
                <h1>
                    <span>Vitrine</span>Local
                </h1>
                <p>Painel do lojista</p>
            </div>

            <nav class="navegacao-lateral">
                <a href="index.html" class="item-lateral">
                    <i data-lucide="layout-dashboard" class="icone-sm"></i> Dashboard
                </a>
                <a href="loja.html" class="item-lateral">
                    <i data-lucide="store" class="icone-sm"></i> Minha loja
                </a>
                <a href="produtos.html" class="item-lateral ativo">
                    <i data-lucide="package" class="icone-sm"></i> Produtos
                </a>
                <a href="configuracoes.html" class="item-lateral">
                    <i data-lucide="settings" class="icone-sm"></i> Configurações
                </a>
            </nav>
            <a href="#" class="item-lateral" id="btnSair">
                <i data-lucide="log-out" class="icone-sm"></i> Sair
            </a>
        </aside>

        <!-- Conteúdo principal -->
        <main class="dashboard-conteudo">
            <div class="dashboard-interno">

                <!-- Cabeçalho -->
                <div class="cabecalho-secao">
                    <div>
                        <h2>Produtos</h2>
                        <p id="subtituloContagem">Carregando...</p>
                    </div>
                    <a href="produtos-novo.html" class="botao">
                        <i data-lucide="plus" class="icone-xs"></i> Adicionar produto
                    </a>
                </div>

                <!-- cartaos de estatísticas -->
                <div class="grade-estatisticas-produtos">
                    <div class="cartao">
                        <p>Total de produtos</p>
                        <p id="statTotal">0</p>
                    </div>
                    <div class="cartao">
                        <p>Produtos ativos</p>
                        <p id="statAtivos">0</p>
                    </div>
                    <div class="cartao">
                        <p>Produtos inativos</p>
                        <p id="statInativos">0</p>
                    </div>
                    <div class="cartao">
                        <p>Total de visualizações</p>
                        <p id="statVisualizacoes">0</p>
                    </div>
                </div>

                <!-- Filtros -->
                <div class="barra-filtros">
                    <div class="campo-busca">
                        <i data-lucide="search" class="icone-busca icone-sm"></i>
                        <input type="text" id="campoBusca" class="input" placeholder="Buscar produtos...">
                    </div>
                    <div class="grupo-filtros">
                        <button class="filtro-botao filtro-botao--ativo" data-filtro="todos">Todos</button>
                        <button class="filtro-botao" data-filtro="ativos">Ativos</button>
                        <button class="filtro-botao" data-filtro="inativos">Inativos</button>
                    </div>
                </div>

                <!-- Tabela de produtos -->
                <div class="cartao">
                    <div class="rolagem-x">
                        <table class="tabela-produtos">
                            <thead>
                                <tr>
                                    <th>Produto</th>
                                    <th>Categoria</th>
                                    <th>Preço</th>
                                    <th>Visualizações</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaProdutosBody">
                                <!-- Linhas inseridas dinamicamente por produtos.js -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/produtos.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
