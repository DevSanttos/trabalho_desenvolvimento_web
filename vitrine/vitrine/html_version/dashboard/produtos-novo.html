<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Produto - Dashboard - VitrineLocal</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard-produtos-novo.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="../js/theme.js"></script>
</head>
<body>
    <div class="dashboard-layout">

        <!-- Barra de navegação -->
        <aside class="painel-lateral">
            <div class="logo-lateral">
                <div>
                    <h1>
                        <span>Vitrine</span>Local
                    </h1>
                    <p>Painel do lojista</p>
                </div>
                <button type="button" class="botao-tema" data-alternar-tema aria-label="Alternar tema claro/escuro" title="Alternar tema">
                    <i data-lucide="sun" class="icone-sm icone-tema-sol"></i>
                    <i data-lucide="moon" class="icone-sm icone-tema-lua"></i>
                </button>
            </div>

            <nav class="navegacao-lateral">
                <a href="index.html" class="item-lateral">
                    <i data-lucide="layout-dashboard" class="icone-sm"></i> Dashboard
                </a>
                <a href="loja.html" class="item-lateral">
                    <i data-lucide="store" class="icone-sm"></i> Minha loja
                </a>
                <a href="produtos.html" class="item-lateral ativo">
                    <i data-lucide="package" class="icone-sm"></i> Produtos
                </a>
                <a href="configuracoes.html" class="item-lateral">
                    <i data-lucide="settings" class="icone-sm"></i> Configurações
                </a>
            </nav>
            <a href="#" class="item-lateral" id="btnSair">
                <i data-lucide="log-out" class="icone-sm"></i> Sair
            </a>
        </aside>

        <!-- Conteúdo principal -->
        <main class="dashboard-conteudo">
            <div class="dashboard-interno">

                <div class="cabecalho-pagina">
                    <h2 id="tituloPagina">Adicionar produto</h2>
                    <p>Preencha as informações do produto</p>
                </div>

                <div class="cartao">
                    <form class="campos-formulario" id="produtoForm">

                        <!-- Imagens do produto (upload de arquivos) -->
                        <div>
                            <label>Imagem do produto</label>
                            <label for="imagemArquivo" class="area-envio">
                                <i data-lucide="upload"></i>
                                <p>Clique para fazer upload</p>
                                <p class="upload-dica">PNG, JPG (pode escolher várias)</p>
                            </label>
                            <input type="file" id="imagemArquivo" accept="image/*" multiple hidden>
                            <div id="imagemPreviews" class="galeria-previews"></div>
                        </div>

                        <!-- Nome do produto -->
                        <div>
                            <label for="nome">Nome do produto *</label>
                            <input type="text" id="nome" class="input" placeholder="Ex: Sofá Retrátil" required>
                        </div>

                        <!-- Preço -->
                        <div>
                            <label for="preco">Preço *</label>
                            <input type="text" id="preco" class="input" placeholder="0,00" required>
                        </div>

                        <!-- Descrição curta -->
                        <div>
                            <label for="descricaoCurta">Descrição curta *</label>
                            <input type="text" id="descricaoCurta" class="input" placeholder="Ex: 3 lugares, tecido" required>
                        </div>

                        <!-- Descrição completa -->
                        <div>
                            <label for="descricaoCompleta">Descrição completa</label>
                            <textarea id="descricaoCompleta" class="textarea" rows="4" placeholder="Descreva detalhadamente o produto, incluindo materiais, dimensões, características especiais, etc."></textarea>
                        </div>

                        <!-- Marca -->
                        <div>
                            <label for="marca">Marca</label>
                            <input type="text" id="marca" class="input" placeholder="Ex: Sofás Brasil">
                        </div>

                        <!-- Categoria (digite a que quiser: Sofás, Notebooks, Camisetas...) -->
                        <div>
                            <label for="categoria">Categoria *</label>
                            <input type="text" id="categoria" class="input" placeholder="Ex: Sofás, Notebooks, Camisetas..." required>
                        </div>

                        <!-- Status -->
                        <div class="campo-status">
                            <div>
                                <label>Status</label>
                                <p>Produto visível na vitrine</p>
                            </div>
                            <label class="interruptor">
                                <input type="checkbox" id="ativo" checked>
                                <span class="interruptor-controle"></span>
                            </label>
                        </div>

                        <p id="produtoMensagem" class="mensagem-erro"></p>

                        <!-- Botões de ação -->
                        <div class="acoes-formulario">
                            <button type="button" class="botao botao-contorno" onclick="window.location.href='produtos.html'">Cancelar</button>
                            <button type="submit" class="botao" id="btnSalvar">Salvar produto</button>
                        </div>

                    </form>
                </div>

            </div>
        </main>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/produto-form.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
