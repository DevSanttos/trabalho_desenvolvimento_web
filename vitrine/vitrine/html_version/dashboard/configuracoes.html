<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Dashboard - VitrineLocal</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard-configuracoes.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="../js/theme.js"></script>
</head>
<body>
    <div class="dashboard-layout">

        <!-- Sidebar -->
        <aside class="painel-lateral">
            <div class="logo-lateral">
                <div>
                    <h1>
                        <span>Vitrine</span>Local
                    </h1>
                    <p>Painel do lojista</p>
                </div>
                <button type="button" class="botao-tema" data-alternar-tema aria-label="Alternar tema claro/escuro" title="Alternar tema">
                    <i data-lucide="sun" class="icone-sm icone-tema-sol"></i>
                    <i data-lucide="moon" class="icone-sm icone-tema-lua"></i>
                </button>
            </div>

            <nav class="navegacao-lateral">
                <a href="index.html" class="item-lateral">
                    <i data-lucide="layout-dashboard" class="icone-sm"></i> Dashboard
                </a>
                <a href="loja.html" class="item-lateral">
                    <i data-lucide="store" class="icone-sm"></i> Minha loja
                </a>
                <a href="produtos.html" class="item-lateral">
                    <i data-lucide="package" class="icone-sm"></i> Produtos
                </a>
                <a href="configuracoes.html" class="item-lateral ativo">
                    <i data-lucide="settings" class="icone-sm"></i> Configurações
                </a>
            </nav>
            <a href="#" class="item-lateral" id="btnSair">
                <i data-lucide="log-out" class="icone-sm"></i> Sair
            </a>
        </aside>

        <!-- Conteúdo principal -->
        <main class="dashboard-conteudo">
            <div class="dashboard-interno">

                <div class="cabecalho-pagina">
                    <h2>Configurações</h2>
                    <p>Gerencie suas preferências e configurações da conta</p>
                </div>

                <!-- Informações da loja -->
                <div class="cartao cartao-secao">
                    <h3 class="secao-titulo-icone">
                        <i data-lucide="user" class="icone-sm"></i> Informações da loja
                    </h3>
                    <form class="campos-formulario">
                        <div>
                            <label for="confNome">Nome da loja</label>
                            <input type="text" id="confNome" class="input">
                        </div>
                        <div>
                            <label for="confEmail">E-mail</label>
                            <input type="email" id="confEmail" class="input">
                            <p class="campo-dica">Este é o e-mail usado para login e notificações</p>
                        </div>
                        <div>
                            <label for="confTelefone">Telefone</label>
                            <input type="tel" id="confTelefone" class="input">
                        </div>
                        <p id="contaMensagem" class="mensagem-erro"></p>
                        <div class="rodape-campos">
                            <button type="button" class="botao botao-contorno" id="btnSalvarConta">Salvar alterações</button>
                        </div>
                    </form>
                </div>

                <!-- Segurança -->
                <div class="cartao cartao-secao">
                    <h3 class="secao-titulo-icone">
                        <i data-lucide="lock" class="icone-sm"></i> Segurança
                    </h3>
                    <form class="campos-formulario">
                        <div>
                            <label for="senhaAtual">Senha atual</label>
                            <input type="password" id="senhaAtual" class="input" placeholder="••••••••">
                        </div>
                        <div>
                            <label for="novaSenha">Nova senha</label>
                            <input type="password" id="novaSenha" class="input" placeholder="••••••••">
                        </div>
                        <div>
                            <label for="confirmarSenha">Confirmar nova senha</label>
                            <input type="password" id="confirmarSenha" class="input" placeholder="••••••••">
                        </div>
                        <p id="senhaMensagem" class="mensagem-erro"></p>
                        <div class="rodape-campos">
                            <button type="button" class="botao botao-contorno" id="btnAlterarSenha">Alterar senha</button>
                        </div>
                    </form>
                </div>

                <!-- Mensalidade -->
                <div class="cartao cartao-secao">
                    <h3 class="secao-titulo-icone">
                        <i data-lucide="credit-card" class="icone-sm"></i> Mensalidade
                    </h3>
                    <div class="info-pagamento">
                        <p>Próximo pagamento:</p>
                        <p>22/12/2026</p>
                    </div>
                    <button type="button" class="botao botao-contorno">Ver histórico</button>
                </div>

            </div>
        </main>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/configuracoes.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
