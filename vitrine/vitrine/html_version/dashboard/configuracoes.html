<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Dashboard - VitrineLocal</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard-configuracoes.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">

        <!-- Sidebar -->
        <aside class="painel-lateral">
            <div class="logo-lateral">
                <h1>
                    <span>Vitrine</span>Local
                </h1>
                <p>Painel do lojista</p>
            </div>

            <nav class="navegacao-lateral">
                <a href="index.html" class="item-lateral">
                    <i data-lucide="layout-dashboard" class="icone-sm"></i> Dashboard
                </a>
                <a href="loja.html" class="item-lateral">
                    <i data-lucide="store" class="icone-sm"></i> Minha loja
                </a>
                <a href="produtos.html" class="item-lateral">
                    <i data-lucide="package" class="icone-sm"></i> Produtos
                </a>
                <a href="configuracoes.html" class="item-lateral ativo">
                    <i data-lucide="settings" class="icone-sm"></i> Configurações
                </a>
            </nav>
        </aside>

        <!-- Conteúdo principal -->
        <main class="dashboard-conteudo">
            <div class="dashboard-interno">

                <div class="cabecalho-pagina">
                    <h2>Configurações</h2>
                    <p>Gerencie suas preferências e configurações da conta</p>
                </div>

                <!-- Informações da loja -->
                <div class="cartao cartao-secao">
                    <h3 class="secao-titulo-icone">
                        <i data-lucide="user" class="icone-sm"></i> Informações da loja
                    </h3>
                    <form class="campos-formulario">
                        <div>
                            <label>Nome da loja</label>
                            <input type="text" class="input" value="Casa e Design">
                        </div>
                        <div>
                            <label>E-mail</label>
                            <input type="email" class="input" value="casaedesign@gmail.com">
                            <p class="campo-dica">Este é o e-mail usado para login e notificações</p>
                        </div>
                        <div>
                            <label>Telefone</label>
                            <input type="tel" class="input" value="(11) 98765-4321">
                        </div>
                        <div class="rodape-campos">
                            <button type="button" class="botao botao-contorno">Salvar alterações</button>
                        </div>
                    </form>
                </div>

                <!-- Segurança -->
                <div class="cartao cartao-secao">
                    <h3 class="secao-titulo-icone">
                        <i data-lucide="lock" class="icone-sm"></i> Segurança
                    </h3>
                    <form class="campos-formulario">
                        <div>
                            <label>Senha atual</label>
                            <input type="password" class="input" placeholder="••••••••">
                        </div>
                        <div>
                            <label>Nova senha</label>
                            <input type="password" class="input" placeholder="••••••••">
                        </div>
                        <div>
                            <label>Confirmar nova senha</label>
                            <input type="password" class="input" placeholder="••••••••">
                        </div>
                        <div class="rodape-campos">
                            <button type="button" class="botao botao-contorno">Alterar senha</button>
                        </div>
                    </form>
                </div>

                <!-- Mensalidade -->
                <div class="cartao cartao-secao">
                    <h3 class="secao-titulo-icone">
                        <i data-lucide="credit-card" class="icone-sm"></i> Mensalidade
                    </h3>
                    <div class="info-pagamento">
                        <p>Próximo pagamento:</p>
                        <p>22/12/2026</p>
                    </div>
                    <button type="button" class="botao botao-contorno">Ver histórico</button>
                </div>

            </div>
        </main>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/dashboard.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
