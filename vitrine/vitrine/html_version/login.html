<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - VitrineLocal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="pagina-login">

        <!-- Painel esquerdo - Marca -->
        <div class="login-painel-marca">
            <div class="login-marca-conteudo">
                <h1 class="login-marca-logo">
                    <span>Vitrine</span>Local
                </h1>
                <p class="login-marca-frase">
                    Conecte-se com o comércio local da sua cidade
                </p>

                <div class="lista-beneficios">
                    <div class="beneficio-item">
                        <div class="beneficio-numero">125+</div>
                        <div class="beneficio-descricao">Lojas cadastradas</div>
                    </div>
                    <div class="beneficio-item">
                        <div class="beneficio-numero">2.500+</div>
                        <div class="beneficio-descricao">Produtos disponíveis</div>
                    </div>
                    <div class="beneficio-item">
                        <div class="beneficio-numero">15+</div>
                        <div class="beneficio-descricao">Cidades atendidas</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Painel direito - Formulário -->
        <div class="login-painel-form">
            <div class="login-form-caixa">
                <h2 class="login-form-titulo">Entrar na plataforma</h2>
                <p class="login-form-subtitulo">Acesse a conta do seu comércio para continuar</p>

                <form class="login-campos">
                    <div class="login-campo">
                        <label>E-mail</label>
                        <input type="email" class="input" placeholder="seu@email.com">
                    </div>

                    <div class="login-campo">
                        <label>Senha</label>
                        <input type="password" class="input" placeholder="••••••••">
                    </div>

                    <div class="login-linha-opcoes">
                        <label class="login-lembrar">
                            <input type="checkbox">
                            <span>Lembrar de mim</span>
                        </label>
                        <a href="#" class="login-esqueceu">Esqueceu a senha?</a>
                    </div>

                    <a href="dashboard/index.html" class="botao login-botao-entrar">
                        Entrar na plataforma
                    </a>

                    <div class="login-separador">
                        <span class="login-separador-texto">ou</span>
                    </div>

                    <button type="button" class="botao botao-contorno login-botao-google">
                        <svg class="icone-google" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        Entrar com Google
                    </button>
                </form>

                <p class="login-rodape">
                    Não tem uma conta? <a href="cadastro.html">Cadastre sua loja</a>
                </p>
            </div>
        </div>

    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
