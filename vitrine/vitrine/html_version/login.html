<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - VitrineLocal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="pagina-login">

        <!-- Painel esquerdo - Marca -->
        <div class="login-painel-marca">
            <div class="marca-grande"><span>Vitrine</span>Local</div>
        </div>

        <!-- Painel direito - Formulário -->
        <div class="login-painel-form">
            <div class="login-form-caixa">
                <h2 class="login-form-titulo">Entrar na plataforma</h2>
                <p class="login-form-subtitulo">Acesse a conta do seu comércio para continuar</p>

                <form class="login-campos" id="loginForm">
                    <div class="login-campo">
                        <label for="loginEmail">E-mail</label>
                        <input type="email" id="loginEmail" class="input" placeholder="seu@email.com" required>
                    </div>

                    <div class="login-campo">
                        <label for="loginSenha">Senha</label>
                        <input type="password" id="loginSenha" class="input" placeholder="••••••••" required>
                    </div>

                    <div class="login-linha-opcoes">
                        <label class="login-lembrar">
                            <input type="checkbox">
                            <span>Lembrar de mim</span>
                        </label>
                        <a href="#" class="login-esqueceu">Esqueceu a senha?</a>
                    </div>

                    <p id="loginMensagem" class="mensagem-erro"></p>

                    <button type="submit" class="botao login-botao-entrar">
                        Entrar na plataforma
                    </button>

                </form>

                <p class="login-rodape">
                    Não tem uma conta? <a href="cadastro.html">Cadastre sua loja</a>
                </p>
            </div>
        </div>

    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
    <script src="js/auth.js"></script>
</body>
</html>
